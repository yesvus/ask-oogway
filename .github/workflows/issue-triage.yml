name: titiz-issue-triage
# Vendored copy of titiz-bot's reusable-issue-triage (v0.8.1). This repo is
# public and titiz-bot is private, so the cross-repo `uses:` caller cannot
# resolve. Keep the steps in sync with upstream when bumping the pinned ref.
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: titiz-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-triage:
    runs-on: ["self-hosted", "gurbet"]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yesvus/titiz-bot
          ref: v0.8.1
          path: titiz-bot
          persist-credentials: false
          token: ${{ secrets.TITIZ_READ_TOKEN }}
      - name: titiz issue-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TITIZ_CONTEXT: "Simple CLI tool for saving tokens by using expensive models only for hard questions/decisions."
        run: |
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          uv run --project titiz-bot --frozen titiz issue-triage "$ISSUE_NUMBER"
