name: titiz-bot
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  # non-/titiz comments get a unique group so they never cancel a review in
  # progress. evaluated at queue time, before the job-level `if` below.
  group: titiz-bot-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}${{ github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/titiz') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # issue_comment leg: only `/titiz` on a PR, by someone with write access.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/titiz') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: [self-hosted, gurbet]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yesvus/titiz-bot
          ref: 55f01d5627d47dd1b61717b915c6be9323238864 # titiz-bot release tag's commit
          path: titiz-bot
          persist-credentials: false
          token: ${{ secrets.TITIZ_READ_TOKEN }} # fine-grained PAT, titiz-bot contents read-only
      - name: titiz-bot review (zen -> go -> cliproxy cheap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          TITIZ_CONTEXT: "Simple CLI tool for saving tokens by using expensive models only for hard questions/decisions."
        run: bash titiz-bot/titiz.sh "$PR_NUMBER"

