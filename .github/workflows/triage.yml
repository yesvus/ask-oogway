name: titiz-triage
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: titiz-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: [self-hosted, gurbet]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yesvus/titiz-bot
          ref: 66f2b3519d4198f655305ca6b4eb0be0e93fbc9f # titiz-bot release tag's commit
          path: titiz-bot
          persist-credentials: false
          token: ${{ secrets.TITIZ_READ_TOKEN }} # fine-grained PAT, titiz-bot contents read-only
      - name: titiz-bot triage (zen -> go -> cliproxy cheap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TITIZ_VERSION: "v0.4.1" # release tag matching PINNED-SHA above, shown in footers
          TITIZ_CONTEXT: "Simple CLI tool for saving tokens by using expensive models only for hard questions/decisions."
        run: bash titiz-bot/triage.sh "$ISSUE_NUMBER"

