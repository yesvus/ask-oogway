name: titiz-triage
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: titiz-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: [self-hosted, gurbet]
    timeout-minutes: 35
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.TITIZ_APP_ID }}
          private-key: ${{ secrets.TITIZ_APP_PRIVATE_KEY }}
          # default token covers the current repo only; the scripts live in
          # titiz-bot, so both repos must be listed.
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            titiz-bot
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yesvus/titiz-bot
          ref: 648e6ed8a33632242edf6cf9a1233a5aa2e7dda3 # v0.3.0
          path: titiz-bot
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: titiz-bot triage (zen -> go -> cliproxy cheap)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TITIZ_CONTEXT: "ask-oogway, python CLI (uv), routes questions to provider CLIs to save tokens, stdlib unittest, no secrets in repo"
        run: bash titiz-bot/triage.sh "$ISSUE_NUMBER"
