name: titiz-pr-review
# Thin static caller. All logic lives in titiz-bot; version is served
# centrally via the @ref below (floating v0 = auto-rollout). This file
# never needs rewiring; only `context` is repo-specific.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    uses: yesvus/titiz-bot/.github/workflows/reusable-pr-review.yml@v0
    secrets: inherit
    with:
      context: "Simple CLI tool for saving tokens by using expensive models only for hard questions/decisions."
      pr: ${{ inputs.pr }}
      version: "v0"
      bot_repo: "yesvus/titiz-bot"
      runs_on: '["self-hosted", "gurbet"]'

